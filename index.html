<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JDF Map - Skeleton Test</title>
  
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css](https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css)" />
  
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: sans-serif; overflow: hidden; }
    #header { height: 50px; background: #1e293b; color: white; display: flex; align-items: center; padding: 0 20px; font-weight: bold; }
    
    /* BRIGHT RED background so we know the CSS loaded and the map div has physical height */
    #map { position: absolute; top: 50px; bottom: 0; left: 0; right: 0; background-color: #fca5a5; }
  </style>
</head>
<body>
  <div id="header">🌲 Diagnostic Skeleton Test</div>
  
  <div id="map"></div>

  <script>
    window.onerror = function(message) { alert("🚨 CRITICAL ERROR: " + message); };
  </script>

  <script src="[https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js](https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js)"></script>

  <script>
    // Load the base map
    const map = L.map('map').setView([48.4100, -124.0000], 11);
    L.tileLayer('[https://tile.openstreetmap.org/](https://tile.openstreetmap.org/){z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);
  </script>
</body>
</html>
